<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт — Домашнее задание</title>
    <style>
        /* Базовые стили */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        p {
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        button {
            background-color: #ffd700;
            color: #333;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        #message {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #message.show {
            opacity: 1;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Привет, я твой сайт! 👋</h1>
        <p>Этот сайт был создан с помощью кода, сгенерированного ИИ для домашнего задания в VS Code. Нажми на кнопку ниже, чтобы увидеть интерактивность.</p>

        <button onclick="showMessage()">Нажми меня!</button>

        <div id="message">🎉 Ура! Ты справился с заданием!</div>

        <div class="footer">Сделано с ❤️ и помощью ИИ</div>
    </div>

    <script>
        function showMessage() {
            const msg = document.getElementById('message');
            msg.classList.add('show');
            setTimeout(() => {
                msg.classList.remove('show');
            }, 3000);
        }
    </script>

</body>
</html>
